<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <base href="/platform/modules/prospeccao/">
    <meta name="theme-color" content="#e11d48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MAXCRM">
    <link rel="apple-touch-icon" href="/platform/modules/prospeccao/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/platform/modules/prospeccao/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/platform/modules/prospeccao/icons/icon-512.png">
    <title>MAXCRM — Login</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles/maxcrm.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        window.FIREBASE_CONFIG = {
            apiKey:            "AIzaSyDzatCQ8zmH4aQftznf7Y5wdYPwFYSiARc",
            authDomain:        "parreiralog-91904.firebaseapp.com",
            projectId:         "parreiralog-91904",
            messagingSenderId: "527633267616",
            appId:             "1:527633267616:web:3567e883b31f7fa02882c5"
        };
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try { firebase.initializeApp(window.FIREBASE_CONFIG); } catch(e) { console.error('[MAXCRM Login] Firebase init error:', e); }
        }
    </script>
    <!-- ParreiraAuth -->
    <script src="/platform/core/js/session-manager.js?v=3.21.69"></script>
    <script src="/platform/core/js/auth.js?v=3.21.69"></script>
</head>
<body>
<div class="login-page">
    <div class="login-logo">MX</div>
    <div class="login-title">MAXCRM</div>
    <div class="login-sub">Prospecção Comercial &amp; CRM<br>Parreira Sistemas</div>

    <form class="login-form" id="loginForm" onsubmit="return false;">
        <div class="form-group">
            <label class="form-label required">Login</label>
            <input type="text" class="form-input" id="loginInput" placeholder="Seu login"
                autocomplete="username" autocapitalize="none" autocorrect="off">
        </div>
        <div class="form-group">
            <label class="form-label required">Senha</label>
            <div class="form-input-group">
                <input type="password" class="form-input" id="senhaInput" placeholder="Sua senha"
                    autocomplete="current-password">
                <button type="button" class="btn btn-secondary btn-sm btn-icon"
                    onclick="toggleSenha()" title="Mostrar/ocultar senha">
                    <span class="material-icons-round" id="eyeIcon">visibility</span>
                </button>
            </div>
        </div>

        <div id="loginErro" style="display:none;color:var(--error);background:var(--error-bg);padding:12px;border-radius:8px;font-size:0.85rem;margin-bottom:12px;text-align:center"></div>

        <button type="submit" class="btn btn-primary" id="loginBtn" onclick="fazerLogin()">
            <span class="material-icons-round">login</span> Entrar
        </button>
    </form>

    <div id="loginVersionBadge" style="margin-top:32px;text-align:center;color:var(--text-muted);font-size:0.75rem">
        MAXCRM v1.3.4 • Plataforma v3.21.69 • Parreira Sistemas
    </div>
</div>

<div id="toast"></div>

<script>
function toggleSenha() {
    var inp = document.getElementById('senhaInput');
    var ico = document.getElementById('eyeIcon');
    if (inp.type === 'password') { inp.type = 'text'; ico.textContent = 'visibility_off'; }
    else { inp.type = 'password'; ico.textContent = 'visibility'; }
}

async function fazerLogin() {
    var login = (document.getElementById('loginInput').value || '').trim();
    var senha = document.getElementById('senhaInput').value || '';
    var btn   = document.getElementById('loginBtn');
    var erro  = document.getElementById('loginErro');

    if (!login || !senha) {
        erro.textContent = 'Informe login e senha.';
        erro.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons-round" style="animation:spin 0.7s linear infinite">autorenew</span> Entrando...';
    erro.style.display = 'none';

    try {
        await Promise.race([
            ParreiraAuth.login(login, senha, 'prospeccao'),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Tempo limite esgotado ao conectar. Verifique sua conexão e tente novamente.')), 10000))
        ]);
        window.location.href = 'index.html';
    } catch(e) {
        console.error('[Login] Erro:', e);
        erro.textContent = e.message || 'Erro ao fazer login.';
        erro.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round">login</span> Entrar';
    }
}

// Enter no form
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') fazerLogin();
});

// Redireciona se já logado
document.addEventListener('DOMContentLoaded', function() {
    if (typeof ParreiraAuth !== 'undefined' && ParreiraAuth.isLogado()) {
        window.location.href = 'index.html';
    }
    // Carregar versão da plataforma dinamicamente
    fetch('/platform/version.json')
        .then(function(r) { return r.json(); })
        .then(function(v) {
            var el = document.getElementById('loginVersionBadge');
            if (el && v && v.version) {
                el.textContent = 'MAXCRM v1.3.4 • Plataforma v' + v.version + ' • Parreira Sistemas';
            }
        }).catch(function(){});
});
</script>
</body>
</html>
