let parar = false;

function log(msg, cls='info') {
  const div = document.getElementById('log');
  div.innerHTML += `<div class="${cls}">${new Date().toLocaleTimeString('pt-BR')} ${msg}</div>`;
  div.scrollTop = div.scrollHeight;
}

async function iniciarImport() {
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  parar = false;

  log(`🔑 Autenticando anonimamente...`);
  try {
    await firebase.auth().signInAnonymously();
    log('✅ Autenticado!', 'ok');
  } catch(e) {
    log(`❌ Erro auth: ${e.message}`, 'err');
    return;
  }

  log(`📦 Iniciando upload de ${LEADS.length} empresas...`);
  let ok = 0, erros = 0;

  for (let i = 0; i < LEADS.length; i++) {
    if (parar) { log('⏹ Upload pausado.', 'info'); break; }

    const empresa = LEADS[i];
    try {
      await db.doc(`${BASE_PATH}/empresas/${empresa.id}`).set(empresa, { merge: true });
      ok++;
      if (ok % 25 === 0 || ok === LEADS.length) {
        log(`✅ ${ok}/${LEADS.length} — ${empresa.nomeFantasia || empresa.razaoSocial}`, 'ok');
      }
    } catch(e) {
      erros++;
      log(`❌ [${i}] ${empresa.razaoSocial?.substring(0,30)}: ${e.message}`, 'err');
    }

    // Update progress bar
    const pct = Math.round(((i+1)/LEADS.length)*100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progText').textContent = `${i+1}/${LEADS.length} (${pct}%) — ${ok} OK, ${erros} erros`;

    // Small delay to avoid rate limiting
    if (i % 50 === 49) await new Promise(r => setTimeout(r, 500));
  }

  log(`\n🎉 Concluído: ${ok} OK, ${erros} erros`, ok > 0 ? 'ok' : 'err');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

function pararImport() {
  parar = true;
  document.getElementById('btnStop').disabled = true;
  setTimeout(() => document.getElementById('btnStart').disabled = false, 1000);
}
